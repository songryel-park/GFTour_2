<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인보드 - Good Feel Tour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* 로그인/사용자 영역 */
        .auth-area {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        /* 로그인 버튼 (비로그인 상태) */
        .login-button {
            background: linear-gradient(135deg, #9B59B6 0%, #8E44AD 100%);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 12px 24px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #8E44AD 0%, #7D3C98 100%);
            color: white;
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 69, 173, 0.3);
        }

        /* 사용자 드롭다운 (로그인 상태) */
        .user-dropdown {
            position: relative;
        }

        .user-dropdown-toggle {
            background: linear-gradient(135deg, #6B73FF 0%, #9B59B6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 12px 20px;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 110px;
        }

        .user-dropdown-toggle:hover {
            background: linear-gradient(135deg, #5A67D8 0%, #8E44AD 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 115, 255, 0.3);
        }

        .user-dropdown-toggle:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(107, 115, 255, 0.2);
        }

        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid #e9ecef;
            min-width: 125px;
            margin-top: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .user-dropdown.show .user-dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f8f9fa;
        }

        .user-dropdown-item:first-child {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .user-dropdown-item:last-child {
            border-bottom: none;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .user-dropdown-item:hover {
            background-color: #f8f9fa;
            color: #6B73FF;
            text-decoration: none;
        }

        .user-dropdown-item i {
            width: 16px;
            text-align: center;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .good-text {
            color: #F4D03F; /* 노란색 */
        }

        .feel-text {
            color: #58D68D; /* 초록색 */
        }

        .tour-text {
            color: #F4D03F; /* 노란색 */
        }

        .subtitle {
            color: #58D68D;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            margin-top: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 800px;
            width: 100%;
        }

        .menu-button {
            background-color: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #58D68D;
            color: #333;
            text-decoration: none;
        }

        .menu-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(135deg, #6B73FF 0%, #9abfff 100%);
            transition: all 0.3s ease;
        }

        .menu-button:hover .menu-icon {
            transform: scale(1.1);
        }

        /* 상단 행 - 연한 색상 */
        .menu-button.light {
            background-color: #FEF9E7; /* 연한 노란색 */
            border-color: #F7DC6F;
        }

        .menu-button.light:hover {
            background-color: #F4D03F;
            color: white;
        }

        .menu-button.light:hover .menu-text {
            color: white;
        }

        /* 하단 행 - 초록색 */
        .menu-button.green {
            background-color: #58D68D;
            color: white;
            border-color: #45B049;
        }

        .menu-button.green .menu-text {
            color: white;
        }

        .menu-button.green:hover {
            background-color: #45B049;
            color: white;
            transform: translateY(-3px);
        }

        .menu-text {
            font-size: 1rem;
            font-weight: 500;
            margin: 0;
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 400px;
            }

            .logo-title {
                font-size: 2.5rem;
            }

            .auth-area {
                top: 15px;
                right: 15px;
            }

            .user-dropdown-toggle {
                padding: 10px 16px;
                font-size: 0.8rem;
                min-width: 100px;
            }

            .login-button {
                padding: 10px 20px;
                font-size: 0.8rem;
            }

            .menu-button {
                min-height: 100px;
                padding: 25px 20px;
            }

            .menu-icon {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 576px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div th:block="content">
    <div class="main-container">
        <!-- 로그인/사용자 영역 -->
        <div class="auth-area">
            <!-- 로그인 상태인 경우 사용자 드롭다운 표시 -->
            <div sec:authorize="isAuthenticated()" class="user-dropdown">
                <button class="user-dropdown-toggle" onclick="toggleDropdown()">
                    <i class="fas fa-user-circle"></i>
                    <span sec:authentication="name">사용자</span>
                </button>
                <div class="user-dropdown-menu">
                    <a th:href="@{/logout}" class="user-dropdown-item">
                        <i class="fas fa-sign-out-alt"></i>
                        log-out
                    </a>
                </div>
            </div>
            <!-- 비로그인 상태인 경우 로그인 버튼 표시 -->
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="login-button">
                    <i class="fas fa-sign-in-alt"></i>
                    log-in
                </a>
            </div>
        </div>

        <!-- 로고 섹션 -->
        <div class="logo-section">
            <h1 class="logo-title mb-0">
                <span class="good-text">Good</span>
                <span class="feel-text">Feel</span>
                <span class="tour-text">Tour</span>
            </h1>
            <p class="subtitle">좋·은·느·낌·여·행·사</p>
        </div>

        <!-- 메뉴 그리드 -->
        <div class="menu-grid">
            <!-- 상단 행 - 연한 색상 -->
            <a th:href="@{/files/search.html}" class="menu-button light">
                <div class="menu-icon">
                    <i class="fas fa-search"></i>
                </div>
                <p class="menu-text">File検索</p>
            </a>

            <a th:href="@{/files/form.html}" class="menu-button light">
                <div class="menu-icon">
                    <i class="fas fa-plus"></i>
                </div>
                <p class="menu-text">新規登録</p>
            </a>

            <a th:href="@{/agts/list.html}" class="menu-button light">
                <div class="menu-icon">
                    <i class="fas fa-building"></i>
                </div>
                <p class="menu-text">AGT管理</p>
            </a>

            <!-- 하단 행 - 초록색 -->
            <a th:href="@{/customers/list.html}" class="menu-button green">
                <div class="menu-icon">
                    <i class="fas fa-users"></i>
                </div>
                <p class="menu-text">顧客名簿</p>
            </a>

            <a th:href="@{/guides/instructions.html}" class="menu-button green">
                <div class="menu-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <p class="menu-text">団体行事指針書</p>
            </a>

            <a th:href="@{/financial}" class="menu-button green">
                <div class="menu-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <p class="menu-text">精算報吿書</p>
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function toggleDropdown() {
        const dropdown = document.querySelector('.user-dropdown');
        dropdown.classList.toggle('show');
    }

    // 드롭다운 외부 클릭 시 닫기
    document.addEventListener('click', function(event) {
        const dropdown = document.querySelector('.user-dropdown');
        const toggle = document.querySelector('.user-dropdown-toggle');

        if (dropdown && !dropdown.contains(event.target)) {
            dropdown.classList.remove('show');
        }
    });

    // ESC 키로 드롭다운 닫기
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            const dropdown = document.querySelector('.user-dropdown');
            if (dropdown) {
                dropdown.classList.remove('show');
            }
        }
    });
</script>
</body>
</html>
