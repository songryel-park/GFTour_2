<!DOCTYPE html>
<html lang="ko" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: html}">
<head>
    <meta charset="UTF-8">
    <title>고객 명단 - Good Feel Tour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }

        /* 고객 테이블 정렬 */
        #customerTable {
            table-layout: fixed;
            width: 100%;
        }

        #customerTable th:nth-child(1) { width: 5%; }
        #customerTable th:nth-child(2) { width: 25%; }
        #customerTable th:nth-child(3) { width: 15%; }
        #customerTable th:nth-child(4) { width: 15%; }
        #customerTable th:nth-child(5) { width: 30%; }
        #customerTable th:nth-child(6) { width: 15%; }
        #customerTable th:last-child,
        #customerTable td:last-child {
            padding-right: 15px;
        }

        /* 인라인 편집 행 스타일 */
        .input-row {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
        }
        .input-row input, .input-row select {
            border: 1px solid #ced4da;
            padding: 0.25rem 0.4rem;
            font-size: 1rem;
            width: 100%;
        }
    </style>
</head>
<body>
    <div th:block="content">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="gf-secondary mb-0">
                            <i class="fas fa-users me-2"></i>顧客名簿
                        </h2>
                    </div>
                    <div>
                        <a th:href="@{/}" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Statistics -->
        <div class="row mb-4">
            <div class="col-md-10">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" class="form-control" placeholder="REF.No" id="searchInput">
                                </div>
                            </div>
                            <div class="col-md-1"></div>
                            <div class="col-md-3">
                                <div class="btn-group w-100" role="group">
                                    <button type="button" class="btn btn-outline-primary" id="searchBtn">
                                        <i class="fas fa-search me-1"></i>search
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="resetBtn">
                                        <i class="fas fa-undo me-1"></i>reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Customer Table -->
        <div class="row">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">
                                <i class="fas fa-list me-2"></i>List
                            </h6>
                            <div class="d-flex gap-3">
                                <button type="button" class="btn btn-outline-primary" id="addCustomer">
                                    <i class="fas fa-plus me-1"></i>追加
                                </button>
                                <button type="button" class="btn btn-outline-success" id="exportExcel">
                                    <i class="fas fa-file-excel me-1"></i>Excel
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="customerTable">
                                <thead class="bg-light">
                                    <tr>
                                        <th>No</th>
                                        <th>名前</th>
                                        <th>年齢</th>
                                        <th>性別</th>
                                        <th>Passport</th>
                                        <th>-</th>
                                    </tr>
                                </thead>
                                <tbody id="customerList">
                                    <!-- Sample Customer Data -->
                                    <tr id="customerInputRow" class="input-row" style="display: none;">
                                        <td><span id="newCustomerNo">1</span></td>
                                        <td><input type="text" id="newCustomerName"></td>
                                        <td><input type="number" id="newCustomerAge" min="0" max="120"></td>
                                        <td>
                                            <select id="newCustomerGender" class="form-select">
                                                <option value="">선택</option>
                                                <option value="男">男</option>
                                                <option value="女">女</option>
                                            </select>
                                        </td>
                                        <td><input type="text" id="newCustomerPassport" maxlength="25"></td>
                                        <td>
                                            <button type="button" class="btn btn-sm btn-success me-1" id="saveCustomerRow">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <!-- Customer rows will be added dynamically -->
                                </tbody>
                            </table>
                            <div id="emptyCustomers" class="text-center text-muted py-4">
                                <div class="mb-4">
                                    <i class="fas fa-user-plus fa-4x text-muted opacity-10"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Additional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let customerIndex = 1;
            let customers = [];

            // Customer inline editing
            document.getElementById('addCustomer').addEventListener('click', function() {
                const inputRow = document.getElementById('customerInputRow');
                const addButton = document.getElementById('addCustomer');
                const emptyCustomers = document.getElementById('emptyCustomers');

                clearCustomerInputs();
                updateCustomerNo();
                inputRow.style.display = 'table-row';
                addButton.disabled = true;

                if (emptyCustomers) {
                    emptyCustomers.style.display = 'none';
                }
                document.getElementById('newCustomerName').focus();
            });

            document.getElementById('saveCustomerRow').addEventListener('click', function() {
                const name = document.getElementById('newCustomerName').value.trim();
                const age = document.getElementById('newCustomerAge').value;
                const gender = document.getElementById('newCustomerGender').value;
                const passport = document.getElementById('newCustomerPassport').value.trim();
                const inputRow = document.getElementById('customerInputRow');
                const editingId = inputRow.getAttribute('data-editing');

                if (editingId) {
                    const customer = {
                        no: parseInt(editingId),
                        name: name,
                        age: age || '',
                        gender: gender || '',
                        passport: passport || ''
                    };
                    customers.push(customer);
                    inputRow.removeAttribute('data-editing');
                } else {
                    const customer = {
                        no: customers.length + 1,
                        name: name,
                        age: age || '',
                        gender: gender || '',
                        passport: passport || ''
                    };
                    customers.push(customer);
                }

                renumberCustomers();
                hideCustomerInputRow();
            });

            // Search functionality
            document.getElementById('searchBtn').addEventListener('click', function() {
                const searchTerm = document.getElementById('searchInput').value;
                console.log('Search customers:', { searchTerm });
                // Implement search functionality
            });

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('searchBtn').click();
                }
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                document.getElementById('searchInput').value = '';
            });

            // Export functionality
            document.getElementById('exportExcel').addEventListener('click', function() {
                console.log('Export customers to Excel');
                exportToExcel();
            });

            function clearCustomerInputs() {
                document.getElementById('newCustomerName').value = '';
                document.getElementById('newCustomerAge').value = '';
                document.getElementById('newCustomerGender').value = '';
                document.getElementById('newCustomerPassport').value = '';
            }

            function updateCustomerNo() {
                document.getElementById('newCustomerNo').textContent = customers.length + 1;
            }

            function hideCustomerInputRow() {
                const inputRow = document.getElementById('customerInputRow');
                const addButton = document.getElementById('addCustomer');
                const emptyCustomers = document.getElementById('emptyCustomers');

                inputRow.style.display = 'none';
                addButton.disabled = false;

                if (customers.length === 0) {
                    emptyCustomers.style.display = 'block';
                }
            }

            function addCustomerToTable(customer) {
                const emptyCustomers = document.getElementById('emptyCustomers');

                addCustomerRowOnly(customer);
                emptyCustomers.style.display = 'none';
            }

            function editCustomerRow(customer, row) {
                customers = customers.filter(c => c.no !== customer.no);
                row.remove();

                document.getElementById('newCustomerNo').textContent = customer.no;
                document.getElementById('newCustomerName').value = customer.name;
                document.getElementById('newCustomerAge').value = customer.age;
                document.getElementById('newCustomerGender').value = customer.gender;
                document.getElementById('newCustomerPassport').value = customer.passport;

                const inputRow = document.getElementById('customerInputRow');
                inputRow.style.display = 'table-row';
                document.getElementById('addCustomer').disabled = true;
                document.getElementById('newCustomerName').focus();

                inputRow.setAttribute('data-editing', customer.no);
            }

            function renumberCustomers() {
                // customers 배열의 번호를 1부터 순차적으로 재정렬
                customers.forEach((customer, index) => {
                    customer.no = index + 1;
                });

                const tbody = document.getElementById('customerList');
                const inputRow = document.getElementById('customerInputRow');

                const existingRows = tbody.querySelectorAll('tr:not(#customerInputRow)');
                existingRows.forEach(row => row.remove());

                customers.forEach(customer => {
                    addCustomerRowOnly(customer);
                });
            }

            function addCustomerRowOnly(customer) {
                const tbody = document.getElementById('customerList');
                const inputRow = document.getElementById('customerInputRow');

                const row = document.createElement('tr');
                row.setAttribute('data-customer-id', customer.no);
                row.innerHTML = `
                    <td>${customer.no}</td>
                    <td>${customer.name}</td>
                    <td>${customer.age || '-'}</td>
                    <td>${customer.gender || '-'}</td>
                    <td>${customer.passport || '-'}</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-warning me-1 edit-customer">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger remove-customer">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.insertBefore(row, inputRow);

                row.querySelector('.remove-customer').addEventListener('click', function() {
                    if (confirm('이 고객정보를 삭제하시겠습니까?')) {
                        const customerId = parseInt(row.getAttribute('data-customer-id'));
                        customers = customers.filter(c => c.no !== customerId);
                        row.remove();
                        renumberCustomers();

                        const emptyCustomers = document.getElementById('emptyCustomers');
                        if (customers.length === 0) {
                            emptyCustomers.style.display = 'block';
                        }
                    }
                });

                row.querySelector('.edit-customer').addEventListener('click', function() {
                    editCustomerRow(customer, row);
                });

                // Add double-click edit functionality
                row.addEventListener('dblclick', function(e) {
                    if (!e.target.closest('button')) {
                        editCustomerRow(customer, row);
                    }
                });
            }

            function exportToExcel() {
                if (customers.length === 0) {
                    alert('내보낼 데이터가 없습니다.');
                    return;
                }

                try {
                    const excelData = customers.map((customer) => ({
                        'No.': customer.no,
                        '名前': customer.name,
                        '年齢': customer.age || '',
                        '性別': customer.gender || '',
                        'Passport': customer.passport || ''
                    }));

                    // 워크북 생성
                    const ws = XLSX.utils.json_to_sheet(excelData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "顧客名簿");

                    const now = new Date();
                    const dateStr = now.getFullYear() + '-' +
                        String(now.getMonth() + 1).padStart(2, '0') + '-' +
                        String(now.getDate()).padStart(2, '0');

                    const filename = `顧客名簿_${dateStr}.xlsx`;
                    XLSX.writeFile(wb, filename);
                } catch (error) {
                    console.error('Excel export error:', error);
                    alert('Excel 내보내기 중 오류가 발생했습니다.');
                }
            }
        });
    </script>
</body>
</html>
