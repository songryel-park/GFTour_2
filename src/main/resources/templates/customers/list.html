<!DOCTYPE html>
<html lang="ko" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: html}">
<head>
    <meta charset="UTF-8">
    <title>고객 명단 - Good Feel Tour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div th:block="content">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="gf-secondary mb-0">
                            <i class="fas fa-users me-2"></i>顧客名簿
                        </h2>
                    </div>
                    <div>
                        <a th:href="@{/}" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Statistics -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" class="form-control" placeholder="REF.No 검색" id="searchInput">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="btn-group w-100" role="group">
                                    <button type="button" class="btn btn-outline-primary" id="searchBtn">
                                        <i class="fas fa-search me-1"></i>search
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="resetBtn">
                                        <i class="fas fa-undo me-1"></i>reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Customer Table -->
        <div class="row">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">
                                <i class="fas fa-list me-2"></i>List
                                <span class="badge bg-info ms-2">3件</span>
                            </h6>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th scope="col">名前</th>
                                        <th scope="col">年齢</th>
                                        <th scope="col">性別</th>
                                        <th scope="col">Passport</th>
                                        <th scope="col" width="10%">備考</th>
                                    </tr>
                                </thead>
                                <tbody id="customerTableBody">
                                    <!-- Sample Customer Data -->
                                    <tr>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <strong>김여행</strong>
                                            </div>
                                        </td>
                                        <td>32</td>
                                        <td>女</td>
                                        <td><code>M12345678</code></td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <button type="button" class="btn btn-outline-success" title="상세보기"
                                                        onclick="viewFile(1)">
                                                    <i class="fas fa-eye"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    
                                    <tr>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <strong>이관광</strong>
                                            </div>
                                        </td>
                                        <td>16</td>
                                        <td>男</td>
                                        <td><code>M87654321</code></td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <button type="button" class="btn btn-outline-success" title="상세보기"
                                                        onclick="viewFile(1)">
                                                    <i class="fas fa-eye"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <strong>박투어</strong>
                                            </div>
                                        </td>
                                        <td>73</td>
                                        <td>男</td>
                                        <td><code>M11223344</code></td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <button type="button" class="btn btn-outline-success" title="상세보기"
                                                        onclick="viewFile(1)">
                                                    <i class="fas fa-eye"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="row mt-4">
            <div class="col">
                <nav aria-label="페이지 네비게이션">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" aria-label="이전">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#" aria-label="다음">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Customer Modal -->
    <div class="modal fade" id="customerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">顧客情報</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="customerForm" class="needs-validation" novalidate>
                        <input type="hidden" id="customerId" name="id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="customerName" class="form-label">名前</label>
                                <input type="text" class="form-control" id="customerName" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="customerAge" class="form-label">年齢</label>
                                <input type="number" class="form-control" id="customerAge" name="age" min="0" max="150" required>
                            </div>
                            <div class="col-md-6">
                                <label for="customerGender" class="form-label">性別</label>
                                <input type="text" class="form-control" id="customerGender" name="gender" required>
                            </div>
                            <div class="col-md-6">
                                <label for="passport" class="form-label">Passport</label>
                                <input type="text" class="form-control" id="passport" name="passport" maxlength="9" required>
                            </div>
                            <div class="col-12">
                                <label for="customerNotes" class="form-label">備考</label>
                                <textarea class="form-control" id="customerNotes" name="notes" rows="2" 
                                          placeholder="고객 관련 특이사항을 입력하세요..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="saveCustomer">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Additional JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Customer management functions
            window.viewCustomer = function(id) {
                console.log('View customer:', id);
                // Implementation for viewing customer details
            };

            window.editCustomer = function(id) {
                console.log('Edit customer:', id);
                const modal = new bootstrap.Modal(document.getElementById('customerModal'));
                // Load customer data and populate form
                modal.show();
            };

            // Checkbox selection functionality
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('tbody input[type="checkbox"]');

            selectAll.addEventListener('change', function() {
                checkboxes.forEach(cb => cb.checked = this.checked);
            });

            // Search functionality
            document.getElementById('searchBtn').addEventListener('click', function() {
                const searchTerm = document.getElementById('searchInput').value;
                const ageFilter = document.getElementById('ageFilter').value;
                
                console.log('Search customers:', { searchTerm, ageFilter });
                // Implement search functionality
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                document.getElementById('searchInput').value = '';
                document.getElementById('ageFilter').value = '';
            });

            // Customer form handling
            document.getElementById('saveCustomer').addEventListener('click', function() {
                const form = document.getElementById('customerForm');
                if (form.checkValidity()) {
                    console.log('Save customer');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('customerModal'));
                    modal.hide();
                } else {
                    form.classList.add('was-validated');
                }
            });

            // Export functionality
            document.getElementById('exportExcel').addEventListener('click', function() {
                console.log('Export customers to Excel');
            });
        });
    </script>
</body>
</html>
