<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Good Feel Tour</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #face13 0%, #46f83d 100%);
            min-height: 100vh;
        }
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .btn-gf-primary {
            background: linear-gradient(135deg, #8E44AD 0%, #A23B72 100%);
            border: none;
            color: white;
        }
        .btn-gf-primary:hover {
            background: linear-gradient(135deg, #6d3485 0%, #8b2d5f 100%);
            color: white;
        }
        .btn-gf-secondary {
            background: linear-gradient(135deg, #93b8ff 0%, #7da8fb 100%);
            border: none;
            color: honeydew;
            font-size: 1rem;
        }
        .form-floating .form-control:focus {
            border-color: #2E86AB;
            box-shadow: 0 0 0 0.2rem rgba(46, 134, 171, 0.25);
        }
        .password-strength {
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .form-check-inline {
            margin-right: 40px;
        }

        .form-check-inline:last-child {
            margin-right: 10px;
        }

        .form-check-input:checked + .form-check-label {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6">
                    <div class="register-card p-4">
                        <!-- Logo and Header -->
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="fas fa-star fa-3x text-warning"></i>
                            </div>
                            <h3 class="fw-bold text-success">Good Feel Tour</h3>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/register}" method="post" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <!-- Personal Information -->
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="이름" required>
                                        <label for="name">
                                            <i class="fas fa-user me-2"></i>Name
                                        </label>
                                        <div class="invalid-feedback">名前を入力してください。</div>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="tel" class="form-control" id="phone" name="phone" 
                                               placeholder="전화번호" required>
                                        <label for="phone">
                                            <i class="fas fa-phone me-2"></i>Phone
                                        </label>
                                        <div class="invalid-feedback">電話番号を入力してください。</div>
                                    </div>
                                </div>

                                <div class="col-lg-12"></div>

                                <!-- Account Information -->
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="password" name="password"
                                               placeholder="비밀번호" required onkeyup="checkPasswordStrength()">
                                        <label for="password">
                                            <i class="fas fa-lock me-2"></i>Password
                                        </label>
                                        <div class="invalid-feedback">8文字以上入力してください。</div>
                                        <div class="password-strength" id="passwordStrength"></div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                               placeholder="비밀번호 확인" required onkeyup="checkPasswordMatch()">
                                        <label for="confirmPassword">
                                            <i class="fas fa-lock me-2"></i>PW Check
                                        </label>
                                        <div id="passwordMatch" class="form-text"></div>
                                    </div>
                                </div>

                                <div class="form-group mb-1">
                                    <div class="text-center">
                                        <div class="form-check form-check-inline me-5">
                                            <input type="radio" class="form-check-input" id="role-agency" name="userRole" value="AGENCY" required>
                                            <label class="form-check-label" for="role-agency">会社</label>
                                        </div>

                                        <div class="form-check form-check-inline">
                                            <input type="radio" class="form-check-input" id="role-guide" name="userRole" value="GUIDE" required>
                                            <label class="form-check-label" for="role-guide">ガイド</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Terms and Conditions -->
                            <div class="col-12">
                                <hr class="my-4">
                            </div>

                            <!-- Submit Button -->
                            <div class="col-12">
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-gf-primary btn-lg">
                                        <i class="fas fa-user-plus me-2"></i>Sign Up
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- Login Link -->
                        <div class="text-center">
                            <p class="text-muted">
                                Do you already have an account?
                                <a th:href="@{/login}" class="text-decoration-none">
                                    <i class="fas fa-sign-in-alt me-1"></i>Log In
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Form validation
        (function() {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');
            
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    checkPasswordStrength();
                    checkPasswordMatch();
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();

        // Password strength checker
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const passwordInput = document.getElementById('password');
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                return;
            }

            // Length check - prerequisite
            if (password.length < 6) {
                strengthDiv.innerHTML = '';
                passwordInput.setCustomValidity('6文字以上入力してください。');
                return;
            }
            passwordInput.setCustomValidity('');

            let score = 0;
            let feedback = [];
            
            // Uppercase/Lowercase check
            if (/[A-Z, a-z]/.test(password)) score++;
            else feedback.push('ローマ字');
            
            // Number check
            if (/[0-9]/.test(password)) score++;
            else feedback.push('数字');
            
            // Special character check
            if (/[~!@#$%^&*+=?]/.test(password)) score++;
            else feedback.push('特殊文字');
            
            let strength = '';
            let className = '';
            
            if (score >= 3) {
                strength = '強力';
                className = 'text-success';
            } else if (score >= 2) {
                strength = '普通';
                className = 'text-warning';
            } else {
                strength = '警告';
                className = 'text-danger';
            }
            
            strengthDiv.innerHTML = `<span class="${className}">パスワードレベル: ${strength}</span>`;
            
            if (feedback.length > 0) {
                strengthDiv.innerHTML += `<br><small class="text-muted">追加条件: ${feedback.join(', ')}</small>`;
            }

            checkPasswordMatch();
        }

        // Password match checker
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchDiv = document.getElementById('passwordMatch');
            const confirmInput = document.getElementById('confirmPassword');
            
            if (confirmPassword.length === 0) {
                matchDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times me-1"></i>パスワードが一致しません。</span>';
                confirmInput.classList.remove('is-valid', 'is-invalid');
                return;
            }
            
            if (password === confirmPassword && password.length >= 6 && confirmPassword.length >= 6) {
                matchDiv.innerHTML = '';
                confirmInput.classList.remove('is-invalid');
                confirmInput.classList.add('is-valid');
                confirmInput.setCustomValidity('');
            } else {
                matchDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times me-1"></i>パスワードが一致しません。</span>';
                confirmInput.classList.remove('is-valid');
                confirmInput.classList.add('is-invalid');
                confirmInput.setCustomValidity('パスワードが一致しません。');
            }
        }

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^\d]/g, '');
            if (value.length <= 3) {
                e.target.value = value;
            } else if (value.length <= 7) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
        });
    </script>
</body>
</html>
