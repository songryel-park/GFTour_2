<!DOCTYPE html>
<html lang="ko" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:replace="~{layout/base :: html}">
<head>
    <meta charset="UTF-8">
    <title>AGT 관리 - Good Feel Tour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }

        #agtTable {
            table-layout: fixed;
            width: 100%;
        }

        #agtTable th:nth-child(1) { width: 20%; }
        #agtTable th:nth-child(2) { width: 15%; }
        #agtTable th:nth-child(3) { width: 15%; }
        #agtTable th:nth-child(4) { width: 40%; }
        #agtTable th:nth-child(5) { width: 25%; }
        #agtTable th:nth-child(6) { width: 10%; }
        #agtTable th:last-child,
        #agtTable td:last-child {
            text-align: left;
            padding-right: 15px;
        }
    </style>
</head>
<body>
    <div th:block="content">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="gf-secondary mb-0">
                            <i class="fas fa-building me-2"></i>AGT 管理
                        </h2>
                    </div>
                    <div>
                        <a th:href="@{/}" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title mb-3">
                            <i class="fas fa-filter me-2"></i>検索条件
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" class="form-control" placeholder="AGT, 担葬者"
                                           id="searchInput">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" id="pageSize">
                                    <option value="10">10個ずつ</option>
                                    <option value="30">30個ずつ</option>
                                    <option value="100">100個ずつ</option>
                                </select>
                            </div>
                            <div class="col-md-2" style="margin: 1%">
                                <div class="btn-group w-100" role="group">
                                    <button type="button" class="btn btn-outline-primary" id="searchBtn">
                                        <i class="fas fa-search me-1"></i>search
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="resetBtn">
                                        <i class="fas fa-undo me-1"></i>reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AGT Table -->
        <div class="row">
            <div class="col">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">
                                <i class="fas fa-list me-2"></i>AGT List
                                <span class="badge bg-info ms-2" id="totalCount">0件</span>
                            </h6>
                            <div class="d-flex gap-3">
                                <button type="button" class="btn btn-outline-primary" id="addAGTBtn">
                                        <i class="fas fa-plus me-2"></i>AGT 追加
                                </button>
                                <button type="button" class="btn btn-outline-success" id="exportExcel">
                                    <i class="fas fa-file-excel me-1"></i>Excel
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" id="agtTable">
                                <thead class="bg-light">
                                    <tr>
                                        <th scope="col">AGT</th>
                                        <th scope="col">担葬者</th>
                                        <th scope="col">支店/代理店</th>
                                        <th scope="col">住所</th>
                                        <th scope="col">Tel.</th>
                                        <th scope="col">-</th>
                                    </tr>
                                </thead>
                                <tbody id="agtTableBody">
                                    <!-- Sample Data Rows -->
                                </tbody>
                            </table>
                        </div>
                        <!-- Empty State (when no data) -->
                        <div id="emptyState" class="text-center p-4" style="display: none;">
                            <div class="mb-4">
                                <i class="fas fa-plus fa-4x text-muted opacity-10"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="row mt-4">
            <div class="col">
                <nav aria-label="페이지 네비게이션">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" aria-label="이전">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#" aria-label="다음">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- AGT Modal -->
    <div class="modal fade" id="agtModal" tabindex="-1" aria-labelledby="agtModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="agtModalLabel">AGT 情報</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="agtForm" class="needs-validation" novalidate>
                        <input type="hidden" id="agtId" name="id">
                        <div class="row g-7">
                            <div class="col-md-6">
                                <label for="agency" class="form-label">AGT</label>
                                <input type="text" class="form-control" id="agency" name="agency" required>
                            </div>
                            <div class="col-md-3">
                                <label for="manager" class="form-label">担葬者</label>
                                <input type="text" class="form-control" id="manager" name="manager" required>
                            </div>
                            <div class="col-md-3">
                                <label for="branch" class="form-label">支店/代理店</label>
                                <input type="text" class="form-control" id="branch" name="branch">
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label">住所</label>
                                <textarea class="form-control" id="address" name="address" rows="1" required></textarea>
                            </div>
                            <div class="col-md-4">
                                <label for="post" class="form-label">郵便</label>
                                <input type="tel" class="form-control" id="post" name="post" required>
                            </div>
                            <div class="col-md-4">
                                <label for="tellNumber" class="form-label">電話</label>
                                <input type="tel" class="form-control" id="tellNumber" name="tellNumber" required>
                            </div>
                            <div class="col-md-4">
                                <label for="faxNumber" class="form-label">FAX</label>
                                <input type="tel" class="form-control" id="faxNumber" name="faxNumber" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" id="saveAGT">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Additional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let agtData = [];
        let filteredData = [...agtData]; // 필터링된 데이터
        let currentPage = 1;
        let pageSize = 10;
        let agtModal;

        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing...');

            agtModal = new bootstrap.Modal(document.getElementById('agtModal'));

            setupEventListeners();
            renderTable(filteredData);
            console.log('Initialization complete');
        });

        function setupEventListeners() {
            const addBtn = document.getElementById('addAGTBtn');
            if (addBtn) {
                addBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    console.log('AGT 추가 clicked');
                    clearForm();
                    document.getElementById('agtModalLabel').textContent = 'AGT 追加';
                    agtModal.show();
                });
            }

            // Search and filter
            const searchBtn = document.getElementById('searchBtn');
            if (searchBtn) {
                searchBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    applyCurrentFilter();
                });
            }

            const resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById('searchInput').value = '';
                    filteredData = [...agtData];
                    renderTable(filteredData);
                });
            }

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        applyCurrentFilter();
                    }
                });
            }

            const saveBtn = document.getElementById('saveAGT');
            if (saveBtn) {
                saveBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    saveAGT();
                });
            }

            // Excel Export
            const excelBtn = document.getElementById('exportExcel');
            if (excelBtn) {
                excelBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    exportToExcel();
                });
            }

        }

        // AGT management functions
        window.editAGT = function(id) {
            console.log('Edit AGT:', id);
            const agt = agtData.find(item => item.id === id);
            if (agt) {
                document.getElementById('agtId').value = agt.id;
                document.getElementById('agency').value = agt.agency || '';
                document.getElementById('manager').value = agt.manager || '';
                document.getElementById('branch').value = agt.branch || '';
                document.getElementById('address').value = agt.address || '';
                document.getElementById('post').value = agt.post || '';
                document.getElementById('tellNumber').value = agt.tellNumber || '';
                document.getElementById('faxNumber').value = agt.faxNumber || '';

                document.getElementById('agtModalLabel').textContent = 'AGT 修正';
                agtModal.show();
            }
        };

        window.deleteAGT = function(id) {
            if (confirm('이 AGT를 삭제하시겠습니까?')) {
                console.log('Delete AGT:', id);
                // Implementation for deleting AGT
                agtData = agtData.filter(item => item.id !== id);
                applyCurrentFilter();
            }
        };

        function clearForm() {
            const form = document.getElementById('agtForm');
            if (form) {
                form.reset();
                document.getElementById('agtId').value = '';
                form.classList.remove('was-validated');
            }
        }

        function applyCurrentFilter() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (searchTerm) {
                filteredData = agtData.filter(agt =>
                    agt.agency.toLowerCase().includes(searchTerm) ||
                    (agt.manager && agt.manager.toLowerCase().includes(searchTerm))
                );
            } else {
                filteredData = [...agtData];
            }
            renderTable(filteredData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('agtTableBody');
            const totalCount = document.getElementById('totalCount');
            const emptyState = document.getElementById('emptyState');

            if (!tbody || !totalCount) {
                console.error('Required elements not found');
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                totalCount.textContent = '0件';
            } else {
                document.getElementById('emptyState').style.display = 'none';
                totalCount.textContent = data.length + '件';

                tbody.innerHTML = data.map(agt => `
                        <tr data-id="${agt.id}">
                            <td><strong>${agt.agency}</strong></td>
                            <td>${agt.manager || ''}</td>
                            <td>${agt.branch || ''}</td>
                            <td>
                                ${agt.address || ''}
                                ${agt.post ? `<br><small class="text-muted"><i class="fas fa-tenge-sign me-1"></i>${agt.post}</small>` : ''}
                            </td>
                            <td>
                                ${agt.tellNumber ? `<i class="fas fa-phone text-muted me-1"></i>${agt.tellNumber}` : ''}
                                ${agt.faxNumber ? `<br><small class="text-muted"><i class="fas fa-fax me-1"></i>${agt.faxNumber}</small>` : ''}
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <button type="button" class="btn btn-outline-warning" title="수정"
                                            onclick="editAGT(${agt.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-danger" title="삭제"
                                            onclick="deleteAGT(${agt.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
            }
        }

        // AGT form handling
        function saveAGT() {
            const form = document.getElementById('agtForm');
            if (!form) return;

            if (form.checkValidity()) {
                const formData = new FormData(form);
                const agtInfo = {
                    agency: formData.get('agency'),
                    manager: formData.get('manager'),
                    branch: formData.get('branch'),
                    address: formData.get('address'),
                    post: formData.get('post'),
                    tellNumber: formData.get('tellNumber'),
                    faxNumber: formData.get('faxNumber')
                };

                const id = document.getElementById('agtId').value;
                if (id) {
                    const index = agtData.findIndex(item => item.id === parseInt(id));
                    if (index !== -1) {
                        agtData[index] = { ...agtData[index], ...agtInfo };
                    }
                    console.log('AGT 수정됨:', agtInfo);
                } else {
                    const newId = Math.max(...agtData.map(item => item.id), 0) + 1;
                    agtData.push({ id: newId, ...agtInfo });
                    console.log('AGT 추가됨:', agtInfo);
                }

                applyCurrentFilter();
                agtModal.hide();
                clearForm();
            } else {
                form.classList.add('was-validated');
            }
        }

        // Export functionality
        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "AGT,担葬者,支店/代理店,住所,郵便,戦火,FAX\n";

            filteredData.forEach(agt => {
                const row = [
                    agt.agency,
                    agt.manager || '',
                    agt.branch || '',
                    agt.address || '',
                    agt.post || '',
                    agt.tellNumber || '',
                    agt.faxNumber || ''
                ].map(field => `"${field}"`).join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "AGT_list.xlsx");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showAlert('Excel 파일이 다운로드되었습니다.', 'success');
        }

        // Initialize
        renderTable(filteredData);
    </script>
</body>
</html>
